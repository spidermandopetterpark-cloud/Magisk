name: Build APK

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build APK
        working-directory: app
        shell: bash
        run: |
          set -e

          echo "=== Ambiente ==="
          java -version
          gradle --version

          echo "=== Projeto ==="
          pwd
          ls -la

          echo "=== Gerando APK ==="

          gradle :apk:assembleDebug \
            --no-daemon \
            --stacktrace \
            --warning-mode all

      - name: Encontrar APK
        shell: bash
        run: |
          echo "=== APK GERADO ==="

          find app -type f -name "*.apk" -print

          APK=$(find app -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERRO: nenhum APK foi gerado."
            exit 1
          fi

          echo "APK: $APK"

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: Magisk-APK
          path: app/**/*.apk
          if-no-files-found: error
