name: Build APK

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Mostrar configuração do projeto
        working-directory: app
        run: |
          echo "=== settings.gradle.kts ==="
          cat settings.gradle.kts || true

          echo "=== build.gradle.kts ==="
          cat build.gradle.kts || true

          echo "=== build-logic ==="
          find build-logic -maxdepth 3 -type f \
            \( -name "*.gradle.kts" -o -name "*.kt" \) \
            -print || true

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Verificar Gradle
        run: |
          java -version
          gradle --version

      - name: Gerar APK
        working-directory: app
        run: |
          gradle :apk:assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Encontrar APK
        run: |
          echo "Procurando APK..."

          find app -type f -name "*.apk" -print

          APK=$(find app -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "Nenhum APK encontrado."
            exit 1
          fi

          echo "APK encontrado:"
          echo "$APK"

          mkdir -p output
          cp "$APK" output/Magisk.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Magisk-APK
          path: output/Magisk.apk
          if-no-files-found: error
