name: Android APK Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Verificar ambiente
        run: |
          java -version
          gradle --version

      - name: Verificar projeto
        working-directory: app
        run: |
          echo "Diretório:"
          pwd

          echo "Arquivos:"
          ls -la

          echo "Settings:"
          ls -l settings.gradle.kts

          echo "Build:"
          ls -l build.gradle.kts

      - name: Limpar projeto
        working-directory: app
        run: |
          gradle clean --stacktrace

      - name: Gerar APK Debug
        working-directory: app
        run: |
          gradle assembleDebug --stacktrace --info

      - name: Localizar APK
        run: |
          echo "=== APKs encontrados ==="
          find app -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Magisk-APK
          path: |
            app/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
