name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare cxx-rs
        run: |
          echo "=== PREPARING CXX-RS ==="

          mkdir -p native/src/external

          rm -rf native/src/external/cxx-rs

          git clone --depth 1 \
            https://github.com/dtolnay/cxx.git \
            native/src/external/cxx-rs

          test -f native/src/external/cxx-rs/Cargo.toml

          echo "=== CXX-RS OK ==="
          ls -la native/src/external/cxx-rs

      - name: Setup NDK
        run: |
          echo "=== SETUP NDK ==="
          python3 build.py ndk

      - name: Build native
        run: |
          echo "=== BUILD NATIVE ==="
          python3 build.py -r native

      - name: Build APK
        run: |
          echo "=== BUILD APK ==="
          python3 build.py -r app

      - name: Show output
        run: |
          echo "=== OUTPUT ==="
          find out -maxdepth 2 -type f -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: magisk-apk
          path: out/*.apk
          if-no-files-found: error
