name: Build APK

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Instalar Gradle mais recente
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'

      - name: Verificar ambiente
        run: |
          echo "=== JAVA ==="
          java -version

          echo "=== GRADLE ==="
          gradle --version

          echo "=== ESTRUTURA ==="
          find app -maxdepth 3 -type f \
            \( -name "settings.gradle*" \
            -o -name "build.gradle*" \
            -o -name "gradle.properties" \) \
            -print

      - name: Verificar projeto Gradle
        working-directory: app
        run: |
          if [ ! -f "settings.gradle.kts" ] && \
             [ ! -f "settings.gradle" ]; then
            echo "ERRO: settings.gradle(.kts) não encontrado em app/"
            exit 1
          fi

          echo "Projeto Gradle encontrado."

      - name: Gerar APK Debug
        working-directory: app
        run: |
          gradle :apk:assembleDebug \
            --no-daemon \
            --no-configuration-cache \
            --stacktrace

      - name: Localizar APK
        run: |
          echo "=== APKs GERADOS ==="

          find app -type f -name "*.apk" -print

          APK=$(find app -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERRO: nenhum APK foi gerado."
            exit 1
          fi

          echo "APK encontrado: $APK"

          mkdir -p output
          cp "$APK" output/Magisk-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Magisk-debug
          path: output/Magisk-debug.apk
          if-no-files-found: error
