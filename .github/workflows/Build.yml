name: Build Magisk

on:
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            lld \
            cmake \
            ninja-build \
            make \
            pkg-config \
            libssl-dev \
            zip \
            unzip \
            xz-utils \
            bzip2 \
            file

      - name: Fix Gradle permissions
        run: |
          chmod +x gradlew

      - name: Prepare submodules
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive

      - name: Setup Magisk NDK
        run: |
          python3 build.py ndk

      - name: Build Magisk
        run: |
          python3 build.py -r app

      - name: Find APK
        if: always()
        run: |
          find . -type f -name "*.apk" -print || true

      - name: Find ZIP
        if: always()
        run: |
          find . -type f -name "*.zip" -print || true

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Magisk-APK
          path: "**/*.apk"
          if-no-files-found: error

      - name: Upload ZIP
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Magisk-ZIP
          path: "**/*.zip"
          if-no-files-found: warn

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            **/*.log
            **/build/reports/**
          if-no-files-found: warn
