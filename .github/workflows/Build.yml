name: Build APK

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar dependências
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3 \
            python3-pip \
            build-essential \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            zip \
            unzip

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Verificar ambiente
        run: |
          echo "=== JAVA ==="
          java -version

          echo "=== GRADLE ==="
          gradle --version

          echo "=== PYTHON ==="
          python3 --version

      - name: Verificar build.py
        run: |
          if [ ! -f "./build.py" ]; then
            echo "ERRO: build.py não encontrado."
            find . -maxdepth 3 -name "build.py" -print
            exit 1
          fi

          chmod +x ./build.py

          echo "build.py encontrado:"
          ls -lh ./build.py

      - name: Compilar binários nativos
        run: |
          echo "=== BUILD BINARIES ==="
          ./build.py binary

      - name: Gerar APK Debug
        working-directory: app
        run: |
          gradle :apk:assembleDebug \
            --no-daemon \
            --no-configuration-cache \
            --stacktrace

      - name: Localizar APK
        run: |
          echo "=== APKs ==="

          find app -type f -name "*.apk" -print

          APK=$(find app -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERRO: nenhum APK foi gerado."
            exit 1
          fi

          echo "APK encontrado:"
          echo "$APK"

          mkdir -p output
          cp "$APK" output/Magisk-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Magisk-debug
          path: output/Magisk-debug.apk
          if-no-files-found: error
