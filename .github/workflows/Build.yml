name: Detect Gradle Wrapper

on:
  push:
  pull_request:

jobs:
  detect-gradle-wrapper:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detectar gradle-wrapper.jar
        shell: bash
        run: |
          echo "Procurando gradle-wrapper.jar..."

          FILE=$(find . -type f -name "gradle-wrapper.jar" -print -quit)

          if [ -n "$FILE" ]; then
            echo "✅ gradle-wrapper.jar encontrado:"
            echo "$FILE"

            echo "Tamanho:"
            ls -lh "$FILE"

            echo "SHA256:"
            sha256sum "$FILE"

            echo "GRADLE_WRAPPER_JAR=$FILE" >> "$GITHUB_ENV"
          else
            echo "❌ gradle-wrapper.jar não encontrado."
            exit 1
          fi

      - name: Verificar Gradle Wrapper
        run: |
          echo "Arquivo detectado: $GRADLE_WRAPPER_JAR"

          if [ -f "./gradlew" ]; then
            echo "✅ gradlew encontrado"
          else
            echo "⚠️ gradlew não encontrado"
          fi

          if [ -f "./gradle/wrapper/gradle-wrapper.properties" ]; then
            echo "✅ gradle-wrapper.properties encontrado"
            cat ./gradle/wrapper/gradle-wrapper.properties
          else
            echo "⚠️ gradle-wrapper.properties não encontrado"
          fi
