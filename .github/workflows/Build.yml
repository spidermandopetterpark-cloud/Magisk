name: Build APK

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Instalar Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Verificar versões
        run: |
          echo "=== Java ==="
          java -version

          echo "=== Gradle ==="
          gradle --version

      - name: Verificar projeto
        working-directory: app
        run: |
          echo "=== Arquivos Gradle ==="

          find . -maxdepth 4 -type f \
            \( -name "settings.gradle" \
            -o -name "settings.gradle.kts" \
            -o -name "build.gradle" \
            -o -name "build.gradle.kts" \) \
            -print

      - name: Gerar APK
        working-directory: app
        run: |
          gradle :apk:assembleDebug \
            --no-daemon \
            --no-configuration-cache \
            --stacktrace

      - name: Encontrar APK
        run: |
          echo "=== APK GERADO ==="

          find app -type f -name "*.apk" -print

          APK=$(find app -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERRO: APK não encontrado."
            exit 1
          fi

          mkdir -p output
          cp "$APK" output/Magisk-debug.apk

          echo "APK:"
          ls -lh output/Magisk-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Magisk-debug
          path: output/Magisk-debug.apk
          if-no-files-found: error
