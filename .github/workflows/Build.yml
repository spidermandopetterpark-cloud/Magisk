name: Android APK Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Ver informações
        run: |
          echo "=== Java ==="
          java -version

          echo ""
          echo "=== Gradle ==="
          gradle --version

          echo ""
          echo "=== Estrutura ==="
          find . -maxdepth 3 -type f \
            \( -name "build.gradle" \
            -o -name "build.gradle.kts" \
            -o -name "settings.gradle" \
            -o -name "settings.gradle.kts" \) \
            -print

      - name: Listar tarefas Gradle
        run: |
          gradle tasks --all --no-daemon --stacktrace

      - name: Compilar APK
        shell: bash
        run: |
          set +e

          echo "=== INICIANDO BUILD ==="

          gradle assembleDebug \
            --no-daemon \
            --stacktrace \
            --info

          EXIT_CODE=$?

          echo ""
          echo "=== APKs ENCONTRADOS ==="
          find . -type f -name "*.apk" -print

          if [ "$EXIT_CODE" -ne 0 ]; then
            echo ""
            echo "======================================"
            echo "BUILD FALHOU"
            echo "======================================"

            exit "$EXIT_CODE"
          fi

      - name: Publicar APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: magisk-apk
          path: |
            **/build/outputs/apk/**/*.apk
            **/build/outputs/apk/*.apk
          if-no-files-found: error
