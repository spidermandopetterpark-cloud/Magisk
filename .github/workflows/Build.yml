name: Build APK

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar dependências
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3 \
            python3-pip \
            build-essential \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            zip \
            unzip

      - name: Configurar Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Verificar ambiente
        run: |
          java -version
          python3 --version
          gradle --version

      - name: Mostrar comandos do build.py
        run: |
          chmod +x build.py
          python3 build.py --help

      - name: Compilar bibliotecas nativas
        run: |
          echo "=== BUILD NATIVE ==="
          python3 build.py native

      - name: Compilar APK
        working-directory: app
        run: |
          echo "=== BUILD APK ==="
          gradle :apk:assembleDebug \
            --no-daemon \
            --no-configuration-cache \
            --stacktrace

      - name: Encontrar APK
        run: |
          echo "=== PROCURANDO APK ==="

          find app -type f -name "*.apk" -print

          APK=$(find app -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERRO: APK não encontrado."
            exit 1
          fi

          mkdir -p output
          cp "$APK" output/Magisk-debug.apk

          ls -lh output/Magisk-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Magisk-debug
          path: output/Magisk-debug.apk
          if-no-files-found: error
